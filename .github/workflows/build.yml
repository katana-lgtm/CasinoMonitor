name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build Project
        run: |
          echo "Содержимое корневой папки:"
          ls -la
          
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Ошибка: файлы сборки Gradle не найдены в репозитории!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Проект обнаружен в директории: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
