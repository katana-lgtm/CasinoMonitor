name: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build Project
        run: |
          echo "Ищем ZIP-архив..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Ошибка: ZIP-архив не найден!"
            exit 1
          fi
          
          echo "Распаковываем архив..."
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          
          echo "Содержимое распакованной папки:"
          ls -la extracted_project
          
          echo "Ищем файл сборки Gradle..."
          BUILD_FILE=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" -print -quit)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Ошибка: файлы сборки Gradle не найдены!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Проект найден в директории: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
